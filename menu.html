<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sidewalk — Artisanal Bakery & Café Menu</title>

  <!-- Google Fonts: Cormorant Garamond & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- StPageFlip CDN -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <!-- Custom Luxury Stylesheet -->
  <link rel="stylesheet" href="menu.css" />
</head>
<body>

  <!-- Top Luxury Navigation Bar -->
  <header class="luxury-navbar">
    <div class="nav-left">
      <a href="index.html" class="back-home-link" aria-label="Back to Homepage">
        <span class="arrow">←</span> Back to Home
      </a>
    </div>

    <div class="nav-brand">
      <span class="brand-title">SIDEWALK</span>
      <span class="brand-subtitle">L'ART DE LA BOULANGERIE</span>
    </div>

    <!-- Quick-Jump Chapter Tabs -->
    <nav class="chapter-tabs" aria-label="Menu Chapters">
      <button class="tab-btn active" data-page="0">Cover</button>
      <button class="tab-btn" data-page="1">Breads &amp; Viennoiserie</button>
      <button class="tab-btn" data-page="3">Cakes &amp; Savory</button>
      <button class="tab-btn" data-page="5">Gourmet Kitchen</button>
      <button class="tab-btn" data-page="7">Teas &amp; Brews</button>
      <button class="tab-btn" data-page="8">Shakes &amp; Elixirs</button>
    </nav>
  </header>

  <!-- Main Stage for the 3D Interactive Menu Book -->
  <main class="book-stage">
    <div class="ambient-glow"></div>

    <div class="book-wrapper">
      <!-- Fixed ID (no space) -->
      <div id="flipbook" class="flipbook-container"></div>
    </div>
  </main>

  <!-- Bottom Flip Controls & Live Page Indicator -->
  <footer class="book-controls">
    <button id="prevBtn" class="control-btn" aria-label="Previous Page">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M15 18l-6-6 6-6" />
      </svg>
      <span>Previous</span>
    </button>

    <div class="page-indicator">
      <span id="pageCounter">Front Cover — Page 1 of 10</span>
      <span class="interaction-hint">Drag corners, swipe, or use arrows to turn pages</span>
    </div>

    <button id="nextBtn" class="control-btn" aria-label="Next Page">
      <span>Next</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M9 18l6-6-6-6" />
      </svg>
    </button>
  </footer>

  <!-- Custom Menu Application Script -->
  <script src="menu.js"></script>
</body>
</html>
